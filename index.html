<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Quote Box</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom right, #f5f7fa, #c3cfe2);
            text-align:center;
          
           background-image: url(nadi.jpg);
           background-repeat:repeat;
           background-size:40% 100%;
           background-position: center;
           background-attachment: fixed;
        }

     #quotes-container{
    margin-top: 100px;
    display: flex;
    flex-wrap: wrap;
   
        }
        .quote-box {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 350px;
            padding: 20px;
            text-align: center;
            color: #333;
            margin: 10px auto;
        }
        .topic {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .quote {
            font-size: 1.2em;
            font-style: italic;
            margin-bottom: 15px;
            color: #34495e;
        }
        .translation {
            font-size: 1em;
            color: #7f8c8d;
        }
        .buttons {
            margin-top: 15px;
        }
        .button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
        }
        .button:hover {
            background-color: #2980b9;
        }
        #header{
background-color:#033759;   
padding:20px;
position:fixed;
top:-26px;
left:0px;
width:100%;
color: #f5f7fa;
       }
    </style>
</head>
<body>
<h1 id="header">Samskrit Quotes</h1>
<div id="quotes-container"></div>
<script src="quotes.js"></script>
<script>
    const container = document.getElementById('quotes-container');

    quotes.forEach(({ topic, quote, translation }) => {
        const quoteBox = document.createElement('div');
        quoteBox.className = 'quote-box';

        quoteBox.innerHTML = `
            <div class="topic">विषय: ${topic}</div>
            <div class="quote">${quote}</div>
            <div class="translation">(${translation})</div>
            <div class="buttons">
                <button class="button" onclick="downloadQuote(this.parentElement.parentElement)">Download</button>
                <button class="button whatsappShareButton" onclick="shareQuote('${topic}', '${quote}', '${translation}')">Share</button>
            </div>
        `;

        container.appendChild(quoteBox);
    });

    // Download Quote as Image
    function downloadQuote(quoteBox) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // Adjusting canvas size to 3:4 ratio
        const width = 1200;
        const height = 1600; 
        canvas.width = width;
        canvas.height = height;

        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        // Text formatting and placement
        ctx.textAlign = 'center';
        ctx.fillStyle = '#2c3e50';
        ctx.font = '50px Arial';
        ctx.fillText(quoteBox.querySelector('.topic').innerText, width / 2, 200);
        ctx.fillStyle = '#34495e';
        ctx.font = '40px Arial';
        ctx.fillText(quoteBox.querySelector('.quote').innerText, width / 2, 600);
        ctx.fillStyle = '#7f8c8d';
        ctx.font = '30px Arial';
        ctx.fillText(quoteBox.querySelector('.translation').innerText, width / 2, 1000);

        // Generate download link
        const link = document.createElement('a');
        link.download = 'quote.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // Share Quote on WhatsApp
    function shareQuote(topic, quote, translation) {
        const pageLink = "https://example.com"; // Add your page link here
        const text = `*${topic}*\n${quote}\n(${translation})\n\nRead more: ${pageLink}`;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // Adjusting canvas size to 3:4 ratio
        const width = 1200;
        const height = 1600;
        canvas.width = width;
        canvas.height = height;

        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        // Text formatting and placement
        ctx.textAlign = 'center';
        ctx.fillStyle = '#2c3e50';
        ctx.font = '50px Arial';
        ctx.fillText(`विषय: ${topic}`, width / 2, 200);
        ctx.fillStyle = '#34495e';
        ctx.font = '40px Arial';
        ctx.fillText(quote, width / 2, 600);
        ctx.fillStyle = '#7f8c8d';
        ctx.font = '30px Arial';
        ctx.fillText(`(${translation})`, width / 2, 1000);

        // Convert canvas to image URL
        canvas.toBlob((blob) => {
            const file = new File([blob], 'quote.png', { type: 'image/png' });
            const data = new FormData();
            data.append('file', file);

            const whatsappURL = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(whatsappURL, '_blank');
        });
    }
</script>
</body>
</html>
