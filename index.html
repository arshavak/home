<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arshavak</title>
</head>
<style>
    *{
        text-align: center;
       
    }
    html::-webkit-scrollbar{display: none;}
    body{
  margin: 0;
  background-color:#f8ecc2;
}

.background-image {
  width: 200px;
  height: 200px;
  background-image: url('shiva.png');
  background-size: cover; /* इमेज को कंटेनर के भीतर फिट करें */
  background-repeat: no-repeat;
  float:left;  
}

 .links:hover{
    background-color: green;
    color: white;
    transform: scale(1.1);
 }
    .links{
  
        transition: .1s ease-out;
        padding: 15px;
        display: inline-block;
        background-color: #d4ff0033;
        margin: 10px;
        color: black;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        width: auto;
        border-radius: 37px;
    }
#container{
    width: 90%;
    margin: auto;
    max-width: 1200px;
    border-radius: 37px;
}
.footer{
    background-color: #4b4d4d;
    position: fixed;
    height: auto;
  left:0px;
   right:0px;
   bottom:0px;
    color: #eee;
    padding: 5px;
    width:100%;
}
</style>
<body>
    <center><h1>ॐ नमः शिवाय</h1></center>
    <center><h3>उपकरणानां पंक्तिः</h3></center>
   <center><div id="container">
   </div></center>
   <br>
    <div class="background-image"></div>
   <footer class="footer">
<marquee id='footerlinks'>
</marquee>
<h3>copyright @2023</h3>
   </footer>
</body>
<script>
const container =document.getElementById("container");
// const footerlinks = document.getElementById("footerlinks");
function createLinks() {
  // Create an array of objects with URL and link text
  const links = [
{ url: 'https://arshavak.github.io/bhagavadgita/', text: 'Gita' },
{ url: 'https://arshavak.github.io/pingala_chhand_shastram/', text: 'Chhandansi' },
{ url: 'https://arshavak.github.io/exampel/', text: 'Ghanapath' }

  ];
  // Loop through the array and create links
  for (let i = 0; i < links.length; i++) {
    const link = document.createElement('a');
    // link.setAttribute('target', '_blank');
    link.setAttribute('class', 'links');
    link.href = links[i].url;
    link.textContent = links[i].text;
container.appendChild(link);
  }
}
// Call the function to create links
createLinks();

</script>

</html>
