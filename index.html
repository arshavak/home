<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Quote Box</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            text-align:center;
            background-color: currentcolor;
          }

     #quotes-container{
    margin-top: 100px;
    display: flex;
    flex-wrap: wrap;
   
        }
        .quote-box {
            background: #0d0d16;
            border-radius: 15px;
            box-shadow: 0px 140px 203px rgb(18 0 255 / 25%);
            width: 90%;
            max-width: 350px;
            padding: 20px;
            text-align: center;
            color: #333;
            margin: 10px auto;
        }
        .topic {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color:#997a00;
        }
        .quote {
            font-size: 1.2em;
            font-style: italic;
            margin-bottom: 15px;
            color: #00ffad;
        }
        .translation {
            font-size: 1em;
            color: #ffffff;
        }
        .buttons {
            margin-top: 15px;
        }
        .button {
            background-color: #000351;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
        }
        .button:hover {
            background-color: #2980b9;
        }
        #header{
background-color:#033759;   
padding:20px;
position:fixed;
top:-26px;
left:0px;
width:100%;
color: #f5f7fa;
       }
    </style>
</head>
<body>
<h1 id="header">Samskrit Quotes</h1>
<div id="quotes-container"></div>
<script src="quotes.js"></script>
<script>
    const container = document.getElementById('quotes-container');

    quotes.forEach(({ topic, quote, translation }) => {
        const quoteBox = document.createElement('div');
        quoteBox.className = 'quote-box';

        quoteBox.innerHTML = `
            <div class="topic">विषय: ${topic}</div>
            <div class="quote">${quote}</div>
            <div class="translation">(${translation})</div>
            <div class="buttons">
                <button class="button" onclick="downloadQuote(this.parentElement.parentElement)">Download</button>
                <button class="button whatsappShareButton" onclick="shareQuote('${topic}', '${quote}', '${translation}')">Share</button>
            </div>
        `;

        container.appendChild(quoteBox);
    });

    // Download Quote as Image
    function downloadQuote(quoteBox) {
    const rect = quoteBox.getBoundingClientRect(); // Quote Box के सटीक आकार प्राप्त करें
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // Canvas का आकार Quote Box के बराबर सेट करें
    canvas.width = rect.width * 2; // High-resolution के लिए 2x scale
    canvas.height = rect.height * 2;

    // Scale canvas for high-resolution output
    ctx.scale(2, 2);

    // Background style
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, rect.width, rect.height);

    // Box shadow (approximation, since canvas doesn't support shadows like CSS)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
    ctx.fillRect(5, 5, rect.width - 10, rect.height - 10);

    // Border radius (approximation)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.arcTo(rect.width, 0, rect.width, rect.height, 15);
    ctx.arcTo(rect.width, rect.height, 0, rect.height, 15);
    ctx.arcTo(0, rect.height, 0, 0, 15);
    ctx.arcTo(0, 0, rect.width, 0, 15);
    ctx.closePath();
    ctx.fill();

    // Text styles
    ctx.textAlign = 'center';

    // विषय
    ctx.fillStyle = '#333';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(quoteBox.querySelector('.topic').innerText, rect.width / 2, 40);

    // उद्धरण
    ctx.fillStyle = '#333';
    ctx.font = '16px Arial';
    ctx.fillText(quoteBox.querySelector('.quote').innerText, rect.width / 2, 80);

    // अनुवाद
    ctx.fillStyle = '#666';
    ctx.font = '14px Arial';
    ctx.fillText(quoteBox.querySelector('.translation').innerText, rect.width / 2, 120);

    // Image download
    const link = document.createElement('a');
    link.download = 'quote.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

    // Share Quote on WhatsApp
    function shareQuote(topic, quote, translation) {
    const pageLink = "https://example.com"; // Add your page link here
    const text = `*${topic}*\n${quote}\n(${translation})\n\nRead more: ${pageLink}`;

    // WhatsApp URL
    const whatsappURL = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(whatsappURL, '_blank');
}

</script>
</body>
</html>
